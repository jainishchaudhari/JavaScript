    const colors = [

    "green",
    "blue",
    "orange",
    "yellow",
    "pink",
    "purple",
    "brown",

    return function(){
        document.body.style.backgroundColor = `${color}`
    }
    }

        button.addEventListener("click", clickHandler(colors[index]));
    })
