<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
      }
      .parent {
        /* background-color: aqua; */
        height: 300px;
        width: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 20px;
      }


    </style>
  </head>
  <body style="background-color: #212121; color: white;" >
    <div class="parent">
      <div class="child1" ></div>
      <div class="child2"></div>
    </div>
    <button>click me!</button>
  </body>

  <script>

    const child1 = document.querySelector(".child1")
    const child2 = document.querySelector(".child2")
    const button = document.querySelector("button")
    let isVisible = false;

    const requestUrl = "https://api.github.com/users/jainishchaudhari";
    const event1 = () => {

    const xhr = new XMLHttpRequest();

    xhr.open("GET", requestUrl);
    xhr.onreadystatechange = function () {
      console.log(xhr.readyState);
      if (xhr.readyState === 4) {
        const data = JSON.parse(this.responseText);

        // console.log(data["type"]);
        const imgg = data["avatar_url"]
        console.log(imgg)
        child1.innerHTML = `<img src=${imgg} alt="Image" style="width:200px; height:200px;">`

        const following = data["following"]
        console.log(following);

        child2.innerHTML = `following count is = ${following}`

        

        // console.log(xhr.responseText); // aa no use Arrow function ma thse
      }
    };
    xhr.send();
    }
    
    button.addEventListener('click', () => {
        if (isVisible === false){

        event1()
        isVisible = true;
    }else{

        child1.innerHTML = "";
        child2.innerHTML = "";
        isVisible = false;
    }
    })

    
  </script>
</html>
